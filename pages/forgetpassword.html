<body>

<nav class="navbar">
  <h2>Movie cave</h2>

    <li><a href="../index.html">Home</a></li>

<main class="forgot-page">
  <div class="forgot-wrapper">
    <div class="forgot-card">
      <h1>Forgot Password?</h1>
      <p class="forgot-subtitle">Enter your email to reset your password</p>

      <form class="forgot-form" id="forgotForm">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="resetEmail" placeholder="example@email.com" required>
        </div>

        <div id="messageBox" class="message-box"></div>

        <button type="submit" class="forgot-btn">Send Reset Code</button>

        <div class="back-link">
          <a href="login.html">← Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="footer">
  <p>© 2026 Movie cave. All rights reserved.</p>
</footer>

<script>
  const forgotForm = document.getElementById('forgotForm');
  if (forgotForm) {
    forgotForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('resetEmail').value.trim();
      const messageBox = document.getElementById('messageBox');
      
      if (!messageBox) return;
      messageBox.style.display = 'block';
      
      if (email === '') {
        messageBox.innerHTML = '❌ Please enter your email address';
        messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
        messageBox.style.color = '#ff8888';
      } 
      else if (!email.includes('@')) {
        messageBox.innerHTML = '❌ Please enter a valid email address';
        messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
        messageBox.style.color = '#ff8888';
      } 
      else {
        messageBox.innerHTML = '✅ Reset code sent to ' + email + '! Check your inbox.';
        messageBox.style.background = 'rgba(76, 175, 80, 0.15)';
        messageBox.style.color = '#88ff88';
        
        setTimeout(function() {
          window.location.href = 'login.html';
        }, 3000);
      }
    });
  }
</script>

</body>
</html>
