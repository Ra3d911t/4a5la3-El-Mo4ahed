<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Movie cave</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .forgot-page {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #0a0a0a;
    }
    .forgot-wrapper {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }
    .forgot-card {
      background: #141414;
      border-radius: 20px;
      padding: 45px 40px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .forgot-card h1 {
      font-size: 32px;
      margin-bottom: 10px;
      text-align: center;
      color: #e50914;
    }
    .forgot-subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
      font-size: 14px;
    }
    .input-group {
      margin-bottom: 25px;
    }
    .forgot-form label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #ccc;
    }
    .forgot-form input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1e1e1e;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    .forgot-form input:focus {
      outline: none;
      border-color: #e50914;
    }
    .forgot-btn {
      width: 100%;
      background: #e50914;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .forgot-btn:hover {
      background: #b20710;
    }
    .message-box {
      padding: 12px;
      margin: 15px 0;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      display: none;
    }
    .back-link {
      text-align: center;
      margin-top: 25px;
    }
    .back-link a {
      color: #e50914;
      text-decoration: none;
      font-size: 13px;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
    @media (max-width: 500px) {
      .forgot-card {
        padding: 30px 25px;
      }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <h2>Movie cave</h2>
  <ul>
    <li><a href="../index.html">Home</a></li>
    <li><a href="search.html">Search</a></li>
    <li><a href="compare.html">Compare</a></li>
    <li><a href="watchlist.html">Watchlist</a></li>
    <li><a href="forum.html#forum-section">Forum</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="exclusive.html">Exclusive</a></li>
    <li><a href="subscribe.html">Subscribe</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="signup.html">Register</a></li>
    <li><a href="login.html">Login</a></li>
    <li><a href="admin.html">Admin</a></li>
  </ul>
</nav>

<main class="forgot-page">
  <div class="forgot-wrapper">
    <div class="forgot-card">
      <h1>Forgot Password?</h1>
      <p class="forgot-subtitle">Enter your email to reset your password</p>

      <form class="forgot-form" id="forgotForm">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="resetEmail" placeholder="example@email.com" required>
        </div>

        <div id="messageBox" class="message-box"></div>

        <button type="submit" class="forgot-btn">Send Reset Code</button>

        <div class="back-link">
          <a href="login.html">← Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="footer">
  <p>© 2026 Movie cave. All rights reserved.</p>
</footer>

<script>
  const forgotForm = document.getElementById('forgotForm');
  if (forgotForm) {
    forgotForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('resetEmail').value.trim();
      const messageBox = document.getElementById('messageBox');
      
      if (!messageBox) return;
      messageBox.style.display = 'block';
      
      if (email === '') {
        messageBox.innerHTML = '❌ Please enter your email address';
        messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
        messageBox.style.color = '#ff8888';
      } 
      else if (!email.includes('@')) {
        messageBox.innerHTML = '❌ Please enter a valid email address';
        messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
        messageBox.style.color = '#ff8888';
      } 
      else {
        messageBox.innerHTML = '✅ Reset code sent to ' + email + '! Check your inbox.';
        messageBox.style.background = 'rgba(76, 175, 80, 0.15)';
        messageBox.style.color = '#88ff88';
        
        setTimeout(function() {
          window.location.href = 'login.html';
        }, 3000);
      }
    });
  }
</script>

</body>
</html>
