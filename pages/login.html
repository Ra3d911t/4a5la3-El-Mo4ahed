<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Movie cave</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <h2>Movie cave</h2>
  <ul>
    <li><a href="../index.html">Home</a></li>
    <li><a href="search.html">Search</a></li>

    <li><a href="admin.html">Admin</a></li>
  </ul>
</nav>

<main class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <h1>Welcome Back</h1>
      <p class="login-subtitle">Sign in to continue</p>

      <form class="login-form" id="loginForm">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" id="togglePassword">👁</button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberCheckbox"> Remember me
          </label>
          <a href="forgetpassword.html" class="forgot-link">Forgot Password?</a>
        </div>

        <div id="loginMessage" class="message-box"></div>

        <button type="submit" class="login-submit-btn">Sign In</button>

        <div class="divider">
          <span>Or continue with</span>
        </div>

        <div class="social-login">
          <button type="button" class="social-btn" id="googleBtn">G Google</button>
          <button type="button" class="social-btn" id="facebookBtn">f Facebook</button>
        </div>

        <p class="signup-redirect">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </p>
      </form>
    </div>
  </div>
</main>

<footer class="footer">
  <p>© 2026 Movie cave. All rights reserved.</p>
</footer>

<script src="../js/script.js"></script>
<script>
  const togglePassword = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('loginPassword');

  if (togglePassword && passwordInput) {
    togglePassword.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.textContent = type === 'password' ? '👁' : '🙈';
    });
  }

  function showMessage(message, isError) {
    const msgBox = document.getElementById('loginMessage');
    if (!msgBox) return;
    msgBox.style.display = 'block';
    msgBox.textContent = message;
    if (isError) {
      msgBox.style.background = 'rgba(229, 9, 20, 0.15)';
      msgBox.style.color = '#ff8888';
    } else {
      msgBox.style.background = 'rgba(76, 175, 80, 0.15)';
      msgBox.style.color = '#88ff88';
    }
  }

  const loginForm = document.getElementById('loginForm');
  if (loginForm) {
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const remember = document.getElementById('rememberCheckbox').checked;
      
      if (email === '') {
        showMessage('Please enter your email address', true);
      } else if (!email.includes('@')) {
        showMessage('Please enter a valid email address', true);
      } else if (password === '') {
        showMessage('Please enter your password', true);
      } else if (password.length < 4) {
        showMessage('Password must be at least 4 characters', true);
      } else {
        let registeredWrong = false;
        try {
          const users = JSON.parse(localStorage.getItem('mc_registered_users') || '[]');
          const u = users.find(function (x) {
            return String(x.email || '').toLowerCase().trim() === email.toLowerCase();
          });
          if (u && u.password !== password) registeredWrong = true;
        } catch (e) {}
        if (registeredWrong) {
          showMessage('Incorrect password for this registered email.', true);
          return;
        }
        const okReg = typeof tryLoginRegisteredUser === 'function' && tryLoginRegisteredUser(email, password);
        const okGuest = password.length >= 4;
        if (!okReg && !okGuest) {
          showMessage('Could not sign in.', true);
          return;
        }
        showMessage('Login successful! Redirecting...', false);

        if (remember) {
          localStorage.setItem('rememberedEmail', email);
        } else {
          localStorage.removeItem('rememberedEmail');
        }
        localStorage.setItem('isLoggedIn', 'true');

        setTimeout(function() {
          window.location.href = '../index.html';
        }, 1500);
      }
    });
  }
  
  const savedEmail = localStorage.getItem('rememberedEmail');
  if (savedEmail) {
    const emailInput = document.getElementById('loginEmail');
    const rememberBox = document.getElementById('rememberCheckbox');
    if (emailInput) emailInput.value = savedEmail;
    if (rememberBox) rememberBox.checked = true;
  }
  
  const googleBtn = document.getElementById('googleBtn');
  if (googleBtn) {
    googleBtn.addEventListener('click', function() {
      showMessage('Google login (demo) - Redirecting...', false);
      setTimeout(function() {
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = '../index.html';
      }, 1000);
    });
  }
  
  const facebookBtn = document.getElementById('facebookBtn');
  if (facebookBtn) {
    facebookBtn.addEventListener('click', function() {
      showMessage('Facebook login (demo) - Redirecting...', false);
      setTimeout(function() {
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = '../index.html';
      }, 1000);
    });
  }
</script>

</body>
</html>
