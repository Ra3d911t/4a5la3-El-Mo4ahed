<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Movie cave</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .login-page {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #0a0a0a;
    }
    .login-wrapper {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }
    .login-card {
      background: #141414;
      border-radius: 20px;
      padding: 45px 40px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .login-card h1 {
      font-size: 32px;
      margin-bottom: 10px;
      text-align: center;
      color: #e50914;
    }
    .login-subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
      font-size: 14px;
    }
    .input-group {
      margin-bottom: 25px;
    }
    .login-form label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #ccc;
    }
    .login-form input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1e1e1e;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    .login-form input:focus {
      outline: none;
      border-color: #e50914;
    }
    .password-wrapper {
      position: relative;
      width: 100%;
    }
    .password-wrapper input {
      width: 100%;
      padding-right: 45px;
      box-sizing: border-box;
    }
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 18px;
    }
    .toggle-password:hover {
      color: #e50914;
    }
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 30px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #bbb;
      cursor: pointer;
    }
    .checkbox-label input {
      width: 16px;
      height: 16px;
      margin: 0;
    }
    .forgot-link {
      color: #e50914;
      text-decoration: none;
      font-size: 13px;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .login-submit-btn {
      width: 100%;
      background: #e50914;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .login-submit-btn:hover {
      background: #b20710;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 25px 0 20px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #333;
    }
    .divider span {
      padding: 0 15px;
      color: #888;
      font-size: 12px;
    }
    .social-login {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }
    .social-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1a1a1a;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .social-btn:hover {
      border-color: #e50914;
      background: #252525;
    }
    .message-box {
      padding: 12px;
      margin: 15px 0;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      display: none;
    }
    .signup-redirect {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
    }
    .signup-redirect a {
      color: #e50914;
      text-decoration: none;
    }
    .signup-redirect a:hover {
      text-decoration: underline;
    }
    @media (max-width: 500px) {
      .login-card {
        padding: 30px 25px;
      }
      .social-login {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <h2>Movie cave</h2>
  <ul>
    <li><a href="../index.html">Home</a></li>
    <li><a href="search.html">Search</a></li>
    <li><a href="compare.html">Compare</a></li>
    <li><a href="watchlist.html">Watchlist</a></li>
    <li><a href="forum.html#forum-section">Forum</a></li>
    <li><a href="news.html">News</a></li>
    <li><a href="exclusive.html">Exclusive</a></li>
    <li><a href="subscribe.html">Subscribe</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="signup.html">Register</a></li>
    <li><a href="login.html">Login</a></li>
    <li><a href="admin.html">Admin</a></li>
  </ul>
</nav>

<main class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <h1>Welcome Back</h1>
      <p class="login-subtitle">Sign in to continue</p>

      <form class="login-form" id="loginForm">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" id="togglePassword">👁</button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberCheckbox"> Remember me
          </label>
          <a href="forgetpassword.html" class="forgot-link">Forgot Password?</a>
        </div>

        <div id="loginMessage" class="message-box"></div>

        <button type="submit" class="login-submit-btn">Sign In</button>

        <div class="divider">
          <span>Or continue with</span>
        </div>

        <div class="social-login">
          <button type="button" class="social-btn" id="googleBtn">G Google</button>
          <button type="button" class="social-btn" id="facebookBtn">f Facebook</button>
        </div>

        <p class="signup-redirect">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </p>
      </form>
    </div>
  </div>
</main>

<footer class="footer">
  <p>© 2026 Movie cave. All rights reserved.</p>
</footer>

<script src="../js/script.js"></script>
<script>
  const togglePassword = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('loginPassword');

  if (togglePassword && passwordInput) {
    togglePassword.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.textContent = type === 'password' ? '👁' : '🙈';
    });
  }

  function showMessage(message, isError) {
    const msgBox = document.getElementById('loginMessage');
    if (!msgBox) return;
    msgBox.style.display = 'block';
    msgBox.textContent = message;
    if (isError) {
      msgBox.style.background = 'rgba(229, 9, 20, 0.15)';
      msgBox.style.color = '#ff8888';
    } else {
      msgBox.style.background = 'rgba(76, 175, 80, 0.15)';
      msgBox.style.color = '#88ff88';
    }
  }

  const loginForm = document.getElementById('loginForm');
  if (loginForm) {
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const remember = document.getElementById('rememberCheckbox').checked;
      
      if (email === '') {
        showMessage('Please enter your email address', true);
      } else if (!email.includes('@')) {
        showMessage('Please enter a valid email address', true);
      } else if (password === '') {
        showMessage('Please enter your password', true);
      } else if (password.length < 4) {
        showMessage('Password must be at least 4 characters', true);
      } else {
        let registeredWrong = false;
        try {
          const users = JSON.parse(localStorage.getItem('mc_registered_users') || '[]');
          const u = users.find(function (x) {
            return String(x.email || '').toLowerCase().trim() === email.toLowerCase();
          });
          if (u && u.password !== password) registeredWrong = true;
        } catch (e) {}
        if (registeredWrong) {
          showMessage('Incorrect password for this registered email.', true);
          return;
        }
        const okReg = typeof tryLoginRegisteredUser === 'function' && tryLoginRegisteredUser(email, password);
        const okGuest = password.length >= 4;
        if (!okReg && !okGuest) {
          showMessage('Could not sign in.', true);
          return;
        }
        showMessage('Login successful! Redirecting...', false);

        if (remember) {
          localStorage.setItem('rememberedEmail', email);
        } else {
          localStorage.removeItem('rememberedEmail');
        }
        localStorage.setItem('isLoggedIn', 'true');

        setTimeout(function() {
          window.location.href = '../index.html';
        }, 1500);
      }
    });
  }
  
  const savedEmail = localStorage.getItem('rememberedEmail');
  if (savedEmail) {
    const emailInput = document.getElementById('loginEmail');
    const rememberBox = document.getElementById('rememberCheckbox');
    if (emailInput) emailInput.value = savedEmail;
    if (rememberBox) rememberBox.checked = true;
  }
  
  const googleBtn = document.getElementById('googleBtn');
  if (googleBtn) {
    googleBtn.addEventListener('click', function() {
      showMessage('Google login (demo) - Redirecting...', false);
      setTimeout(function() {
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = '../index.html';
      }, 1000);
    });
  }
  
  const facebookBtn = document.getElementById('facebookBtn');
  if (facebookBtn) {
    facebookBtn.addEventListener('click', function() {
      showMessage('Facebook login (demo) - Redirecting...', false);
      setTimeout(function() {
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = '../index.html';
      }, 1000);
    });
  }
</script>

</body>
</html>
