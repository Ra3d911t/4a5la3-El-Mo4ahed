<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Movies — Movie cave</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .search-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .search-filters {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .filter-btn {
      background: #1f1f1f;
      border: 1px solid #f5c518;
      color: #f5c518;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #f5c518;
      color: #121212;
    }
    #searchResults {
      margin-top: 30px;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <h2>Movie cave</h2>
  <ul>
    <li><a href="../index.html">Home</a></li>
    <li><a href="search.html">Search</a></li>
    <li><a href="watchlist.html">Watchlist</a></li>
    <li><a href="login.html">Login</a></li>
    <li><a href="forum.html#forum-section">Forum</a></li>
    <li><a href="news.html">News</a></li>
  </ul>
</nav>

<!-- Genre Sidebar -->
<aside class="genre-sidebar" id="genreSidebar">
  <h3>🎭 Genres</h3>
  <ul class="genre-list">
    <li><a href="#" class="active" onclick="filterSearchByGenre('all', event)">All Movies</a></li>
    <li><a href="#" onclick="filterSearchByGenre('series', event)">Series</a></li>
    <li><a href="#" onclick="filterSearchByGenre('action', event)">Action</a></li>
    <li><a href="#" onclick="filterSearchByGenre('sci-fi', event)">Sci-Fi</a></li>
    <li><a href="#" onclick="filterSearchByGenre('drama', event)">Drama</a></li>
    <li><a href="#" onclick="filterSearchByGenre('comedy', event)">Comedy</a></li>
    <li><a href="#" onclick="filterSearchByGenre('thriller', event)">Thriller</a></li>
    <li><a href="#" onclick="filterSearchByGenre('adventure', event)">Adventure</a></li>
    <li><a href="#" onclick="filterSearchByGenre('crime', event)">Crime</a></li>
    <li><a href="#" onclick="filterSearchByGenre('romance', event)">Romance</a></li>
    <li><a href="#" onclick="filterSearchByGenre('animation', event)">Animation</a></li>
    <li><a href="#" onclick="filterSearchByGenre('superhero', event)">Superhero</a></li>
    <li><a href="#" onclick="filterSearchByGenre('social', event)">Social</a></li>
  </ul>
</aside>

<!-- Mobile Menu Toggle -->
<button class="menu-toggle" onclick="toggleSidebar()">☰</button>

<!-- Main Content -->
<div class="main-content-with-sidebar">
  <div class="search-container">
    <h1>🔍 Search Movies</h1>
    <input type="text" id="searchInput" placeholder="Type movie name, genre, or director...">
    
        
    <div class="cards" id="searchResults"></div>
  </div>
</div>
</div>

<footer>
  <p>© 2026 Movie cave</p>
</footer>

<script src="../js/script.js"></script>
</body>
</html>
