<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | MoviePortal</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .signup-page {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #0a0a0a;
    }

    .signup-wrapper {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .signup-card {
      background: #141414;
      border-radius: 20px;
      padding: 45px 40px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .signup-card h1 {
      font-size: 32px;
      margin-bottom: 10px;
      text-align: center;
      color: #e50914;
    }

    .signup-subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .signup-form label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #ccc;
    }

    .signup-form input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1e1e1e;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    .signup-form input:focus {
      outline: none;
      border-color: #e50914;
    }

    .name-row {
      display: flex;
      gap: 15px;
      margin-bottom: 5px;
    }

    .name-row .input-group {
      flex: 1;
      margin-bottom: 20px;
    }

    .password-strength {
      font-size: 11px;
      margin-top: 5px;
      padding: 5px 10px;
      border-radius: 8px;
      display: inline-block;
    }

    .password-strength.weak {
      color: #ff8888;
      background: rgba(255, 68, 68, 0.1);
    }

    .password-strength.medium {
      color: #ffcc44;
      background: rgba(255, 204, 68, 0.1);
    }

    .password-strength.strong {
      color: #88ff88;
      background: rgba(136, 255, 136, 0.1);
    }

    .signup-btn {
      width: 100%;
      background: #e50914;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .signup-btn:hover {
      background: #b20710;
    }

    .message-box {
      padding: 12px;
      margin: 15px 0;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      display: none;
    }

    .login-link {
      text-align: center;
      margin-top: 25px;
    }

    .login-link a {
      color: #e50914;
      text-decoration: none;
      font-size: 13px;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 550px) {
      .signup-card {
        padding: 30px 25px;
      }
      .name-row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <h2>4a5la3 El Mo4ahed</h2>
  <ul>
    <li><a href="../index.html">Home</a></li>
    <li><a href="search.html">Search</a></li>
    <li><a href="watchlist.html">Watchlist</a></li>
    <li><a href="login.html">Login</a></li>
  </ul>
</nav>

<main class="signup-page">
  <div class="signup-wrapper">
    <div class="signup-card">
      <h1>Create Account</h1>
      <p class="signup-subtitle">Join MoviePortal today</p>

      <form class="signup-form" id="signupForm">
        <div class="name-row">
          <div class="input-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="John" required>
          </div>
          <div class="input-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" required>
          </div>
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Create a strong password" required>
          <div id="passwordStrength" class="password-strength"></div>
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
        </div>

        <div id="signupMessage" class="message-box"></div>

        <button type="submit" class="signup-btn">Sign Up</button>

        <div class="login-link">
          <a href="login.html">Already have an account? Sign In →</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="footer">
  <p>© 2026 MoviePortal. All rights reserved.</p>
</footer>

<script>
  // Password strength checker
  const passwordInput = document.getElementById('signupPassword');
  const strengthDiv = document.getElementById('passwordStrength');
  
  passwordInput.addEventListener('input', function() {
    const password = this.value;
    let strength = 0;
    
    if (password.length >= 6) strength++;
    if (password.length >= 10) strength++;
    if (password.match(/[a-z]/)) strength++;
    if (password.match(/[A-Z]/)) strength++;
    if (password.match(/[0-9]/)) strength++;
    if (password.match(/[^a-zA-Z0-9]/)) strength++;
    
    if (password.length === 0) {
      strengthDiv.innerHTML = '';
      strengthDiv.className = 'password-strength';
    }
    else if (strength <= 2) {
      strengthDiv.innerHTML = '⚠️ Weak password';
      strengthDiv.className = 'password-strength weak';
    }
    else if (strength <= 4) {
      strengthDiv.innerHTML = '⚡ Medium password';
      strengthDiv.className = 'password-strength medium';
    }
    else {
      strengthDiv.innerHTML = '✅ Strong password';
      strengthDiv.className = 'password-strength strong';
    }
  });
  
  // Form submission
  document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const messageBox = document.getElementById('signupMessage');
    
    messageBox.style.display = 'block';
    
    if (firstName === '') {
      messageBox.innerHTML = '❌ Please enter your first name';
      messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
      messageBox.style.color = '#ff8888';
    }
    else if (lastName === '') {
      messageBox.innerHTML = '❌ Please enter your last name';
      messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
      messageBox.style.color = '#ff8888';
    }
    else if (email === '' || !email.includes('@')) {
      messageBox.innerHTML = '❌ Please enter a valid email address';
      messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
      messageBox.style.color = '#ff8888';
    }
    else if (password.length < 6) {
      messageBox.innerHTML = '❌ Password must be at least 6 characters';
      messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
      messageBox.style.color = '#ff8888';
    }
    else if (password !== confirm) {
      messageBox.innerHTML = '❌ Passwords do not match';
      messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
      messageBox.style.color = '#ff8888';
    }
    else {
      messageBox.innerHTML = '✅ Account created successfully! Redirecting to Login...';
      messageBox.style.background = 'rgba(76, 175, 80, 0.15)';
      messageBox.style.color = '#88ff88';
      
      localStorage.setItem('newUserEmail', email);
      localStorage.setItem('newUserName', firstName + ' ' + lastName);
      
      setTimeout(function() {
        window.location.href = 'login.html';
      }, 2000);
    }
  });
</script>

</body>
</html>
