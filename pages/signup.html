<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Movie cave</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <h2>Movie cave</h2>
  <ul>
    <li><a href="../index.html">Home</a></li>
    <li><a href="search.html">Search</a></li>
    <li><a href="compare.html">Compare</a></li>
    <li><a href="watchlist.html">Watchlist</a></li>
    <li><a href="forum.html#forum-section">Forum</a></li>
    <li><a href="news.html">News</a></li>

    <li><a href="login.html">Login</a></li>
    <li><a href="admin.html">Admin</a></li>
  </ul>
</nav>

<main class="signup-page">
  <div class="signup-wrapper">
    <div class="signup-card">
      <h1>Create Account</h1>
      <p class="signup-subtitle">Join Movie cave today</p>

      <form class="signup-form" id="signupForm">
        <div class="name-row">
          <div class="input-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="John" required>
          </div>
          <div class="input-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" required>
          </div>
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Create a strong password" required>
          <div id="passwordStrength" class="password-strength"></div>
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
        </div>

        <div id="signupMessage" class="message-box"></div>

        <button type="submit" class="signup-btn">Sign Up</button>

        <div class="login-link">
          <a href="login.html">Already have an account? Sign In →</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="footer">
  <p>© 2026 Movie cave. All rights reserved.</p>
</footer>

<script src="../js/script.js"></script>
<script>
  // Password strength checker
  const passwordInput = document.getElementById('signupPassword');
  const strengthDiv = document.getElementById('passwordStrength');
  
  passwordInput.addEventListener('input', function() {
    const password = this.value;
    let strength = 0;
    
    if (password.length >= 6) strength++;
    if (password.length >= 10) strength++;
    if (password.match(/[a-z]/)) strength++;
    if (password.match(/[A-Z]/)) strength++;
    if (password.match(/[0-9]/)) strength++;
    if (password.match(/[^a-zA-Z0-9]/)) strength++;
    
    if (password.length === 0) {
      strengthDiv.innerHTML = '';
      strengthDiv.className = 'password-strength';
    }
    else if (strength <= 2) {
      strengthDiv.innerHTML = '⚠️ Weak password';
      strengthDiv.className = 'password-strength weak';
    }
    else if (strength <= 4) {
      strengthDiv.innerHTML = '⚡ Medium password';
      strengthDiv.className = 'password-strength medium';
    }
    else {
      strengthDiv.innerHTML = '✅ Strong password';
      strengthDiv.className = 'password-strength strong';
    }
  });
  
  // Form submission
  document.getElementById('signupForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const messageBox = document.getElementById('signupMessage');
    
    messageBox.style.display = 'block';
    
    if (firstName === '') {
      messageBox.innerHTML = '❌ Please enter your first name';
      messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
      messageBox.style.color = '#ff8888';
    }
    else if (lastName === '') {
      messageBox.innerHTML = '❌ Please enter your last name';
      messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
      messageBox.style.color = '#ff8888';
    }
    else if (email === '' || !email.includes('@')) {
      messageBox.innerHTML = '❌ Please enter a valid email address';
      messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
      messageBox.style.color = '#ff8888';
    }
    else if (password.length < 6) {
      messageBox.innerHTML = '❌ Password must be at least 6 characters';
      messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
      messageBox.style.color = '#ff8888';
    }
    else if (password !== confirm) {
      messageBox.innerHTML = '❌ Passwords do not match';
      messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
      messageBox.style.color = '#ff8888';
    }
    else {
      const fullName = firstName + ' ' + lastName;
      if (typeof registerUserAccount === 'function') {
        const res = registerUserAccount(fullName, email, password);
        if (!res.ok) {
          messageBox.innerHTML = '❌ ' + res.message;
          messageBox.style.background = 'rgba(229, 9, 20, 0.15)';
          messageBox.style.color = '#ff8888';
          return;
        }
      }
      messageBox.innerHTML = '✅ Account created successfully! Redirecting to Login...';
      messageBox.style.background = 'rgba(76, 175, 80, 0.15)';
      messageBox.style.color = '#88ff88';

      localStorage.setItem('newUserEmail', email);
      localStorage.setItem('newUserName', fullName);

      setTimeout(function() {
        window.location.href = 'login.html';
      }, 2000);
    }
  });
</script>

</body>
</html>
